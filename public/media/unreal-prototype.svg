<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Unreal interaction prototype</title>
  <desc id="desc">Abstract game prototype diagram with connected trigger nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10131d"/>
      <stop offset="1" stop-color="#261c52"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8f7cff"/>
      <stop offset="1" stop-color="#45d6e8"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="38"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1250" cy="150" r="250" fill="#6656e8" opacity=".22" filter="url(#blur)"/>
  <circle cx="300" cy="760" r="260" fill="#19bdd0" opacity=".12" filter="url(#blur)"/>
  <g fill="none" stroke="url(#glow)" stroke-width="4" opacity=".8">
    <path d="M240 480C420 480 410 290 590 290S760 480 920 480 1080 300 1330 300"/>
    <path d="M590 290C690 290 660 670 840 670s210-190 310-190"/>
  </g>
  <g fill="#111522" stroke="#9b8cff" stroke-width="4">
    <rect x="170" y="415" width="210" height="130" rx="22"/>
    <rect x="500" y="225" width="220" height="130" rx="22"/>
    <rect x="810" y="415" width="220" height="130" rx="22"/>
    <rect x="1220" y="235" width="210" height="130" rx="22"/>
    <rect x="735" y="605" width="220" height="130" rx="22"/>
  </g>
  <g fill="#f5f3ff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="middle">
    <text x="275" y="490">PLAYER</text>
    <text x="610" y="300">TRIGGER</text>
    <text x="920" y="490">INTERACTION</text>
    <text x="1325" y="310">RESPONSE</text>
    <text x="845" y="680">FEEDBACK</text>
  </g>
  <text x="90" y="120" fill="#f8f7ff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800">UNREAL INTERACTION</text>
  <text x="94" y="178" fill="#a9a1c4" font-family="Arial, Helvetica, sans-serif" font-size="26" letter-spacing="5">GAME PROTOTYPE · MECHANICS · TRIGGERS</text>
  <text x="94" y="820" fill="#a9a1c4" font-family="Arial, Helvetica, sans-serif" font-size="24">Gameplay demonstration available from the project link</text>
</svg>
